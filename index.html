<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>استبيان - MKADMEH EST</title>
  <style>
    :root{
      --gold:#D4AF37;
      --gold-dark:#b98f2a;
      --bg:#ffffff;
      --muted:#666;
      --card-shadow: 0 6px 22px rgba(0,0,0,0.08);
      --radius:14px;
      font-family: "Segoe UI", Tahoma, "Helvetica Neue", Arial, sans-serif;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:#111;
      line-height:1.45;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:32px;
    }

    .container{
      width:100%;
      max-width:820px;
      background:linear-gradient(180deg, rgba(255,255,255,1) 0%, rgba(255,250,240,1) 100%);
      border-radius:var(--radius);
      box-shadow:var(--card-shadow);
      overflow:hidden;
      border:1px solid rgba(212,175,55,0.12);
    }

    header{
      display:flex;
      align-items:center;
      gap:16px;
      padding:20px 28px;
      background:linear-gradient(90deg, rgba(212,175,55,0.12), rgba(212,175,55,0.02));
      border-bottom:1px solid rgba(0,0,0,0.04);
    }
    .logo {
      width:72px;
      height:72px;
      border-radius:12px;
      background:linear-gradient(135deg,var(--gold),var(--gold-dark));
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-weight:800;
      font-size:18px;
      box-shadow: 0 6px 18px rgba(212,175,55,0.18);
    }
    .title {
      font-size:20px;
      font-weight:700;
      color:#222;
    }
    .subtitle {
      color:var(--muted);
      font-size:13px;
      margin-top:4px;
    }

    main{
      padding:22px 28px 30px 28px;
    }

    form .section-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:8px;
    }
    .section-title h3{
      margin:0;
      font-size:16px;
      color:#222;
    }
    .progress {
      font-size:13px;
      color:var(--muted);
    }

    .card{
      background:#fff;
      border-radius:12px;
      padding:16px;
      margin-bottom:14px;
      border:1px solid rgba(0,0,0,0.03);
    }

    label.q{
      display:block;
      font-weight:600;
      margin-bottom:8px;
      color:#111;
    }

    .inputs { display:flex; flex-direction:column; gap:10px; }

    input[type="text"], input[type="email"], textarea, select {
      padding:10px 12px;
      border-radius:8px;
      border:1px solid rgba(0,0,0,0.08);
      font-size:14px;
      width:100%;
      resize:vertical;
    }
    textarea{ min-height:86px; }

    .row { display:flex; gap:12px; flex-wrap:wrap; }
    .col { flex:1; min-width:160px; }

    .choices { display:flex; flex-direction:column; gap:8px; }
    .choice { display:flex; align-items:center; gap:8px; }
    .choice input { transform:scale(1.05); }

    .rating { display:flex; gap:8px; }
    .rating label { padding:8px 12px; border-radius:8px; background:#fff; border:1px solid rgba(0,0,0,0.06); cursor:pointer; font-weight:600; }

    .actions{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-top:8px;
    }

    button.primary{
      background:linear-gradient(90deg,var(--gold),var(--gold-dark));
      color:#121212;
      border:none;
      padding:10px 16px;
      border-radius:10px;
      font-weight:700;
      cursor:pointer;
      box-shadow: 0 8px 18px rgba(212,175,55,0.14);
    }
    button.ghost{
      background:transparent;
      border:1px solid rgba(0,0,0,0.06);
      padding:10px 16px;
      border-radius:10px;
      cursor:pointer;
      color:var(--muted);
    }

    .note { font-size:13px; color:var(--muted); }

    .summary{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,0.35);
      z-index:50;
    }
    .summary .box{
      width:92%;
      max-width:760px;
      background:#fff;
      border-radius:12px;
      padding:18px;
      box-shadow:var(--card-shadow);
    }
    .summary h2{ margin:0 0 8px 0; }
    .answers { margin-top:12px; display:flex; flex-direction:column; gap:10px; max-height:48vh; overflow:auto; padding-right:6px;}
    .ans { padding:10px; border-radius:10px; background:linear-gradient(180deg,#fff,#fff); border:1px solid rgba(0,0,0,0.04); }
    .download { margin-top:12px; display:flex; gap:10px; justify-content:flex-end; }

    footer{
      padding:14px 28px;
      border-top:1px solid rgba(0,0,0,0.03);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      background:transparent;
    }
    .brand-small { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; }

    @media (max-width:640px){
      .logo{width:60px;height:60px;font-size:16px}
      body{padding:18px}
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">MK<br>EST</div>
      <div>
        <div class="title">استبيان معرض الآليات الثقيلة</div>
        <div class="subtitle">MKADMEH EST — نقدر آراء الزوار لتحسين المعرض والخدمات</div>
      </div>
    </header>
    <main>
      <p>تم تجهيز الاستبيان. افتحه على جهازك وشاهده في Chrome.</p>
    </main>
  </div>
</body>
</html>
